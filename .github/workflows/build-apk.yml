name: Build Release APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Validate and Restore Gradle Wrapper
        run: |
          echo "=== VALIDATING GRADLE WRAPPER JAR ==="
          mkdir -p gradle/wrapper
          if ! java -jar gradle/wrapper/gradle-wrapper.jar --version >/dev/null 2>&1; then
            echo "gradle-wrapper.jar is missing, corrupt or invalid. Regenerating wrapper..."
            if command -v gradle >/dev/null 2>&1; then
              gradle wrapper --gradle-version 9.3.1
            else
              echo "Downloading fresh gradle-wrapper.jar..."
              curl -sSL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v9.3.1/gradle/wrapper/gradle-wrapper.jar
            fi
          fi
          echo "Gradle wrapper jar is verified and working."

      - name: Print Build Environment Info
        run: |
          echo "=== BUILD ENVIRONMENT INFO ==="
          echo "rootDir: $(pwd)"
          echo "appDir: $(pwd)/app"
          echo "signingConfig.storeFile: $(pwd)/avanyx-release.jks"
          echo "Java version:"
          java -version
          echo "Gradle version:"
          ./gradlew -v

      - name: Setup Release Keystore
        env:
          AVANYX_RELEASE_KEYSTORE_BASE64: ${{ secrets.AVANYX_RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "=== SETTING UP RELEASE KEYSTORE ==="
          RELEASE_KEYSTORE="$(pwd)/avanyx-release.jks"

          if [ ! -f "$RELEASE_KEYSTORE" ] && [ -n "$AVANYX_RELEASE_KEYSTORE_BASE64" ]; then
            echo "Restoring avanyx-release.jks from AVANYX_RELEASE_KEYSTORE_BASE64 secret..."
            echo "$AVANYX_RELEASE_KEYSTORE_BASE64" | base64 -d > "$RELEASE_KEYSTORE"
          fi

          if [ ! -f "$RELEASE_KEYSTORE" ]; then
            echo "ERROR: avanyx-release.jks does not exist!"
            exit 1
          fi

          echo "Verified avanyx-release.jks exists."
          ls -l "$RELEASE_KEYSTORE"

      - name: Setup Firebase Google Services Configuration
        env:
          GOOGLE_SERVICES_JSON_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "=== SETTING UP GOOGLE SERVICES CONFIGURATION ==="
          mkdir -p app
          if [ -n "$GOOGLE_SERVICES_JSON_SECRET" ]; then
            echo "Reconstructing app/google-services.json from secret..."
            echo "$GOOGLE_SERVICES_JSON_SECRET" | base64 -d > app/google-services.json 2>/dev/null || echo "$GOOGLE_SERVICES_JSON_SECRET" > app/google-services.json
          fi
          if [ ! -s "app/google-services.json" ]; then
            echo "ERROR: app/google-services.json is missing or empty!"
            echo "Please configure GOOGLE_SERVICES_JSON secret in GitHub Actions."
            exit 1
          fi
          echo "Verified app/google-services.json exists and is non-empty."

      - name: Safe Cache Clean
        run: ./gradlew clean --no-daemon

      - name: Build Release APK & AAB
        env:
          AVANYX_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.AVANYX_RELEASE_KEYSTORE_PASSWORD }}
          AVANYX_RELEASE_KEY_ALIAS: ${{ secrets.AVANYX_RELEASE_KEY_ALIAS }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace --no-daemon

      - name: Verify Release APK Exists
        run: |
          echo "=== VERIFYING RELEASE APK OUTPUT ==="
          mkdir -p app/build/outputs/apk/release/
          if [ -f .build-outputs/app-release.apk ] && [ ! -f app/build/outputs/apk/release/app-release.apk ]; then
            cp .build-outputs/app-release.apk app/build/outputs/apk/release/app-release.apk
          fi
          if [ ! -f app/build/outputs/apk/release/app-release.apk ] && [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/app-release.apk
          fi
          if [ ! -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "ERROR: app/build/outputs/apk/release/app-release.apk does not exist!"
            exit 1
          fi
          ls -l app/build/outputs/apk/release/app-release.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore
