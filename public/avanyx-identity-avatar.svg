<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Gold Metallic Gradients -->
    <linearGradient id="goldGradMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8A3"/>
      <stop offset="30%" stop-color="#E5B84B"/>
      <stop offset="55%" stop-color="#FCD679"/>
      <stop offset="80%" stop-color="#C6922C"/>
      <stop offset="100%" stop-color="#E8BE58"/>
    </linearGradient>

    <linearGradient id="goldGradCrown" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C6922C"/>
      <stop offset="40%" stop-color="#FFE494"/>
      <stop offset="70%" stop-color="#F7C85C"/>
      <stop offset="100%" stop-color="#FFF0B8"/>
    </linearGradient>

    <linearGradient id="goldRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A034"/>
      <stop offset="25%" stop-color="#FFF3C4"/>
      <stop offset="50%" stop-color="#B8860B"/>
      <stop offset="75%" stop-color="#FBD97D"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>

    <radialGradient id="darkBgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="60%" stop-color="#0B0B0D"/>
      <stop offset="100%" stop-color="#050506"/>
    </radialGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#D4AF37" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Circle with Subtle Obsidian Gradient -->
  <circle cx="256" cy="256" r="248" fill="url(#darkBgGrad)"/>

  <!-- Outer Elegant Gold Ring -->
  <circle cx="256" cy="256" r="236" stroke="url(#goldRingGrad)" stroke-width="7" fill="none" filter="url(#goldGlow)"/>
  <circle cx="256" cy="256" r="242" stroke="url(#goldRingGrad)" stroke-width="1.5" stroke-opacity="0.6" fill="none"/>

  <!-- Golden Crown Emblem -->
  <g filter="url(#goldGlow)">
    <!-- Crown Base Arch -->
    <path d="M 160 128 C 210 148 302 148 352 128 C 342 108 358 64 358 64 L 320 84 L 292 48 L 256 80 L 220 48 L 192 84 L 154 64 C 154 64 170 108 160 128 Z" fill="url(#goldGradCrown)"/>
    <!-- Crown Diamonds / Spheres -->
    <circle cx="220" cy="46" r="6" fill="#FFF4D0"/>
    <circle cx="292" cy="46" r="6" fill="#FFF4D0"/>
  </g>

  <!-- Stylized "AK" Royal Monogram -->
  <g filter="url(#goldGlow)">
    <!-- Letter 'A' Left Wing & Crossbar -->
    <path d="M 124 142 C 160 142 196 172 216 220 L 168 338 L 224 338 L 236 308 L 176 308 L 202 244 C 216 270 234 308 244 338 L 250 338 L 224 200 C 210 162 170 142 124 142 Z" fill="url(#goldGradMain)"/>
    
    <!-- Central Vertical Pillar of A and K (Fused Column) -->
    <path d="M 230 148 L 290 148 L 282 172 L 270 172 L 270 316 L 284 316 L 290 342 L 230 342 L 236 316 L 250 316 L 250 172 L 236 172 Z" fill="url(#goldGradMain)"/>

    <!-- Letter 'A' Left Leg Serifs and Body Details -->
    <path d="M 112 342 L 172 342 L 164 320 L 150 320 L 198 206 L 160 300 L 130 320 L 118 320 Z" fill="url(#goldGradMain)"/>

    <!-- Letter 'K' Upper Wing & Chevron -->
    <path d="M 270 240 L 320 186 C 336 168 360 156 392 150 L 396 170 C 368 174 348 184 334 200 L 294 246 L 350 332 C 364 354 384 366 408 370 L 396 394 C 360 388 334 368 316 340 L 270 270 Z" fill="url(#goldGradMain)"/>

    <!-- Bottom Flourish Swoosh Under AK -->
    <path d="M 244 352 C 280 352 320 376 370 398 C 324 416 260 404 244 352 Z" fill="url(#goldGradMain)"/>
  </g>
</svg>
