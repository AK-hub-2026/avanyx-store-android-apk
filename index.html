    <!-- Initial Dark Mode Script -->
    <script>
      try {
        const saved = localStorage.getItem('avanyx_dark');
        if (saved === 'false') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>

          }
